<IfModule mod_evasive20.c>
    DOSHashTableSize    3097
    # Max requests per page per interval
    DOSPageCount        2
    # Max requests per site per interval
    DOSSiteCount        50
    # Intervals in seconds
    DOSPageInterval     1
    DOSSiteInterval     1
    # How long to block the IP (in seconds)
    DOSBlockingPeriod   60

    # Log directory we created in the Dockerfile
    DOSLogDir           "/var/log/mod_evasive"

    # Log the block to a file (Docker-friendly, avoids needing an email server)
    DOSSystemCommand    "echo '[`date`] DOS Attack detected from %s' >> /var/log/mod_evasive/dos_evasive.log"
</IfModule>